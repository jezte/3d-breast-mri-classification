
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breast-mri-3d"
version = "0.1.0"
description = "Breast MRI radiomics feature extraction and lesion classification experiments"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "pydicom>=2.4",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "scikit-learn>=1.3",
    "pyradiomics>=3.0",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5,<4.0"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
